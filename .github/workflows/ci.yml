name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Cache Zig
        uses: actions/cache@v4
        with:
          path: ~/.cache/zig
          key: ${{ runner.os }}-zig-${{ hashFiles('.zig-cache/never_was_here') }}
          enableCrossOsArchive: true

      - name: Install native database clients (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev libpq-dev libmariadb-dev

      - name: Install native database clients (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install sqlite3 libpq mariadb-connector-c || true

      - name: Check formatting
        run: zig fmt --check src examples tests build.zig

      - name: Build
        run: zig build

      - name: Unit tests
        run: zig build test --summary all

      - name: Benchmark smoke (ReleaseFast)
        run: zig build benchmark -Doptimize=ReleaseFast --summary all

      # Each example is a real end-to-end path (comptime codegen → SQL → SQLite),
      # and `zig build` above only *compiles* them: running them is the only thing
      # that executes what they assert. They are cheap, and a failure names the
      # example rather than a batch.
      - name: Example smoke (start)
        run: zig build run-start --summary all

      - name: Example smoke (complex e-commerce)
        run: zig build run-complex --summary all

      - name: Example smoke (pool)
        run: zig build run-pool --summary all

      - name: Example smoke (advanced patterns)
        run: zig build run-advanced --summary all

      - name: Example smoke (interceptor, multi-tenant)
        run: zig build run-interceptor --summary all

      - name: Example smoke (check_sql)
        run: zig build run-check-sql --summary all

      - name: Example smoke (migrate, file-based migrations)
        run: zig build migrate --summary all

      - name: Version consistency
        run: bash scripts/check-version.sh

      - name: Integration tests (SQLite; Postgres/MySQL skipped when no server)
        run: zig build test-integration --summary all

  integration-db:
    name: Integration tests with PostgreSQL and MariaDB
    runs-on: ubuntu-latest
    services:
      postgres:
        # `pgvector/pgvector:pg17` is the official PostgreSQL image with the
        # `vector` extension baked in, so the three pgvector integration cases
        # (vector column, distance ordering, hnsw index) run here instead of
        # skipping — they would otherwise only ever be exercised on a machine
        # that installed pgvector by hand. Plain `postgres:<tag>` images skip
        # them by design (the tests check `pg_available_extensions`).
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: zent_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PG_DSN: "host=localhost dbname=zent_test user=postgres password=postgres"
      # 127.0.0.1, not localhost: libmariadb treats "localhost" as a unix
      # socket (/run/mysqld/mysqld.sock), which does not exist in this job's
      # container — the server lives in the sibling service container.
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASS: root
      MYSQL_DB: zent_test

    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Cache Zig
        uses: actions/cache@v4
        with:
          path: ~/.cache/zig
          key: ${{ runner.os }}-zig-${{ hashFiles('.zig-cache/never_was_here') }}
          enableCrossOsArchive: true

      - name: Install native database clients
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev libpq-dev libmariadb-dev

      - name: Integration tests with real databases
        run: zig build test-integration --summary all

  pg-wire:
    name: PostgreSQL-wire compatibility (HeliosDB Nano)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Cache Zig
        uses: actions/cache@v4
        with:
          path: ~/.cache/zig
          key: ${{ runner.os }}-zig-${{ hashFiles('.zig-cache/never_was_here') }}
          enableCrossOsArchive: true

      - name: Install native database clients
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev libpq-dev

      # A wire-compatible server is the point of this job: it speaks libpq's
      # protocol without carrying PostgreSQL's whole catalog or SQL surface, and
      # zent's migration/introspection paths have to degrade there rather than
      # die. The instance is in-memory and thrown away with the runner, which is
      # what makes `scripts/check-pg-wire.sh`'s baseline meaningful — some tests
      # create and re-create `SERIAL` tables, and a kept sequence answers
      # different ids on a second run.
      - name: Start HeliosDB Nano
        run: |
          set -euo pipefail
          REL=https://github.com/HeliosDatabase/HeliosDB-Nano/releases/download/v4.41.1
          ASSET=heliosdb-nano-v4.41.1-x86_64-unknown-linux-gnu.tar.gz
          mkdir -p /tmp/helios
          curl -sSLo /tmp/helios.tgz "$REL/$ASSET"
          curl -sSLo /tmp/helios.sha "$REL/SHA256SUMS"
          ( cd /tmp && grep " $ASSET$" helios.sha > helios.one && sha256sum -c helios.one )
          tar xzf /tmp/helios.tgz -C /tmp/helios
          /tmp/helios/heliosdb-nano start --memory --port 55432 --listen 127.0.0.1 >/tmp/helios/nano.log 2>&1 &
          for _ in $(seq 1 30); do
            if (echo >/dev/tcp/127.0.0.1/55432) 2>/dev/null; then
              echo "HeliosDB Nano is listening on 55432"
              exit 0
            fi
            sleep 1
          done
          echo "HeliosDB Nano did not start:" >&2
          cat /tmp/helios/nano.log >&2
          exit 1

      - name: Compare the failing set with the baseline
        run: bash scripts/check-pg-wire.sh

  deadcode:
    name: Dead-code baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig (zigmodu toolchain)
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Build zmodu CLI from zigmodu (pinned v0.15.32)
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev
          git clone --depth 1 --branch v0.15.32 https://github.com/chy3xyz/zigmodu.git /tmp/zigmodu
          cd /tmp/zigmodu && zig build -Ddb=sqlite

      - name: Check dead-code baseline
        run: ZMODU=/tmp/zigmodu/zig-out/bin/zmodu bash scripts/check-deadcode.sh

  benchmark-regression:
    name: Benchmark regression canary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so we can check out the parent commit for the A/B
          # baseline without a second network fetch.
          fetch-depth: 0

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Install native database clients
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev

      # The committed scripts/benchmark-baseline.txt is machine-relative
      # (recorded on a fast local Mac), so comparing it against CI runners
      # (3-6x slower) is meaningless. Instead, do a same-runner A/B: record a
      # baseline at the parent commit, then measure HEAD on the same runner.
      # The default threshold (100%) then genuinely catches a 2x regression
      # in HEAD relative to the commit it was pushed on top of.
      #
      # Use HEAD~1 rather than github.event.before: the latter can point at a
      # dangling SHA after a force-push (amend/rewrite), which is unreachable
      # from the freshly-fetched refs and makes `worktree add` fail. HEAD~1 is
      # always the immediately-preceding commit in the fetched history.
      - name: Record baseline at parent commit
        run: |
          git worktree add --detach /tmp/zent-base "HEAD~1"
          (cd /tmp/zent-base && bash scripts/bench-compare.sh --save /tmp/bench-base.txt)

      - name: Compare HEAD against parent
        run: |
          if [ ! -f /tmp/bench-base.txt ]; then
            echo "baseline not recorded; skipping regression compare"
            exit 0
          fi
          bash scripts/bench-compare.sh /tmp/bench-base.txt
