name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0-dev.1567+f0354179a

      - name: Cache Zig
        uses: actions/cache@v4
        with:
          path: ~/.cache/zig
          key: ${{ runner.os }}-zig-${{ hashFiles('.zig-cache/never_was_here') }}
          enable-cross-os-cache: true

      - name: Install native database clients (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev libpq-dev libmariadb-dev

      - name: Install native database clients (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install sqlite3 libpq mariadb-connector-c || true

      - name: Check formatting
        run: zig fmt --check src examples tests build.zig

      - name: Build
        run: zig build

      - name: Unit tests
        run: zig build test --summary all

      - name: Benchmark smoke (ReleaseFast)
        run: zig build benchmark -Doptimize=ReleaseFast --summary all

      - name: Example smoke (start)
        run: zig build run-start --summary all

      - name: Version consistency
        run: bash scripts/check-version.sh

      - name: Integration tests (SQLite; Postgres/MySQL skipped when no server)
        run: zig build test-integration --summary all

  integration-db:
    name: Integration tests with PostgreSQL and MariaDB
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: zent_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PG_DSN: "host=localhost dbname=zent_test user=postgres password=postgres"
      # 127.0.0.1, not localhost: libmariadb treats "localhost" as a unix
      # socket (/run/mysqld/mysqld.sock), which does not exist in this job's
      # container — the server lives in the sibling service container.
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASS: root
      MYSQL_DB: zent_test

    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0-dev.1567+f0354179a

      - name: Cache Zig
        uses: actions/cache@v4
        with:
          path: ~/.cache/zig
          key: ${{ runner.os }}-zig-${{ hashFiles('.zig-cache/never_was_here') }}
          enable-cross-os-cache: true

      - name: Install native database clients
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev libpq-dev libmariadb-dev

      - name: Integration tests with real databases
        run: zig build test-integration --summary all

  deadcode:
    name: Dead-code baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig (zigmodu toolchain)
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0-dev.1567+f0354179a

      - name: Build zmodu CLI from zigmodu (pinned v0.15.31)
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev
          git clone --depth 1 --branch v0.15.31 https://github.com/chy3xyz/zigmodu.git /tmp/zigmodu
          cd /tmp/zigmodu && zig build -Ddb=sqlite

      - name: Check dead-code baseline
        run: ZMODU=/tmp/zigmodu/zig-out/bin/zmodu bash scripts/check-deadcode.sh

  benchmark-regression:
    name: Benchmark regression canary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so we can check out the parent commit for the A/B
          # baseline without a second network fetch.
          fetch-depth: 0

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0-dev.1567+f0354179a

      - name: Install native database clients
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev

      # The committed scripts/benchmark-baseline.txt is machine-relative
      # (recorded on a fast local Mac), so comparing it against CI runners
      # (3-6x slower) is meaningless. Instead, do a same-runner A/B: record a
      # baseline at the parent commit, then measure HEAD on the same runner.
      # The default threshold (100%) then genuinely catches a 2x regression
      # in HEAD relative to the commit it was pushed on top of.
      - name: Record baseline at parent commit
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          if [ -z "${BASE_SHA}" ] || [ "${BASE_SHA}" = "0000000000000000000000000000000000000000" ]; then
            echo "no parent commit; skipping regression canary"
            exit 0
          fi
          git worktree add --detach /tmp/zent-base "${BASE_SHA}"
          (cd /tmp/zent-base && bash scripts/bench-compare.sh --save /tmp/bench-base.txt)

      - name: Compare HEAD against parent
        run: |
          if [ ! -f /tmp/bench-base.txt ]; then
            echo "baseline not recorded; skipping regression compare"
            exit 0
          fi
          bash scripts/bench-compare.sh /tmp/bench-base.txt
